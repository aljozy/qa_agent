# Example configuration file for QA Agent
# Copy this file to config.yaml and update with your settings

# AI Model Configuration
ai:
  # Provider: "kiro" (default, uses Kiro's built-in models) or "openai"
  provider: "kiro"
  
  # Model selection:
  # For Kiro provider: "auto" (default), "fast", "balanced", "quality"
  # For OpenAI provider: "gpt-4", "gpt-4-turbo", "gpt-3.5-turbo", etc.
  model: "auto"
  
  # Temperature for generation (0.0 - 2.0, default: 0.7)
  # Lower values = more deterministic, higher values = more creative
  temperature: 0.7
  
  # Maximum tokens for generation (default: 2000)
  max_tokens: 2000
  
  # API key (only required for OpenAI provider)
  # Can use environment variable substitution: api_key: "${OPENAI_API_KEY}"
  # api_key: "your-api-key-here"

output:
  # Directory where generated test artifacts will be saved
  directory: "output"

